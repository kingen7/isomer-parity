name: verify

on:
  push:
    branches: [main]
  pull_request:

jobs:
  prototype:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: unit tests
        working-directory: prototype
        run: node --test
      - name: golden corpus acceptance gate
        working-directory: prototype
        run: node gate.mjs